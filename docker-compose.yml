version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: cloudpulse_db
    restart: always
    environment:
      POSTGRES_DB: cloudpulse_db
      POSTGRES_USER: cloudpulse_admin
      POSTGRES_PASSWORD: cloudpulse_password
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse_admin -d cloudpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Job Queue Service
  redis:
    image: redis:7-alpine
    container_name: cloudpulse_redis
    restart: always
    ports:
      - "6379:6379"

  # 3. CloudPulse Node.js Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudpulse_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloudpulse_db
      DB_USER: cloudpulse_admin
      DB_PASSWORD: cloudpulse_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: cloudpulse-production-super-secret-jwt-key-2026
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. CloudPulse Asynchronous Worker Service
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: cloudpulse_worker
    restart: always
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: cloudpulse_db
      DB_USER: cloudpulse_admin
      DB_PASSWORD: cloudpulse_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 5. CloudPulse Nginx + React SPA Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudpulse_frontend
    restart: always
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pg_data:
