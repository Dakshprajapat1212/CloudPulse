name: CloudPulse Production CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 347181052564.dkr.ecr.us-east-1.amazonaws.com
  ASG_NAME: cloudpulse-asg-20261001

jobs:
  test-backend:
    name: 🧪 Verify Backend Tests & TypeScript Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd backend
          npm ci

      - name: Compile TypeScript & Run Tests
        run: |
          cd backend
          npm run build
          npm test

  test-frontend:
    name: 🧪 Verify Frontend Production Build (React)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Verify React Production SPA Build
        run: |
          cd frontend
          npm run build

  build-and-deploy:
    name: 🚀 Multi-Container Build, ECR Push & AWS ASG Rolling Deployment
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build & Push Backend Container Image
      - name: Build & Push Backend Image (SHA + latest)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/cloudpulse-backend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/cloudpulse-backend:latest

      # 2. Build & Push Worker Container Image
      - name: Build & Push Worker Image (SHA + latest)
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          file: ./worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/cloudpulse-worker:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/cloudpulse-worker:latest

      # 3. Build & Push Frontend Container Image
      - name: Build & Push Frontend Image (SHA + latest)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/cloudpulse-frontend:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/cloudpulse-frontend:latest

      # 4. Trigger Zero-Downtime Rolling Refresh on AWS ASG
      - name: Trigger Zero-Downtime AWS Auto Scaling Refresh
        run: |
          echo "Triggering Rolling Instance Refresh on AWS Auto Scaling Group..."
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 50, "InstanceWarmup": 180}' || true
